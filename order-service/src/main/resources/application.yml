spring:
  application:
    name: order-service
server:
  port: ${SERVER_PORT:8082}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
logging:
  include-application-name: false
  pattern:
    correlation: "[${spring.application.name},traceId=%X{traceId:-},spanId=%X{spanId:-}] "
clients:
  connect-timeout: ${CLIENT_CONNECT_TIMEOUT:1s}
  read-timeout: ${CLIENT_READ_TIMEOUT:3s}
  product:
    base-url: ${PRODUCT_SERVICE_URL:http://localhost:8083}
