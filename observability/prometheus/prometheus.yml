global:
  scrape_interval: 5s

scrape_configs:
  - job_name: bff
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["bff:8080"]
  - job_name: member-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["member-service:8080"]
  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["order-service:8080"]
  - job_name: product-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["product-service:8080"]
